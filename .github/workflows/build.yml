# Rebuilds index.html from src/ + data/ on every push, after the consistency check passes.
# A push that breaks consistency fails here and the published page stays on the last good build.
name: Build OCC SCADA page
on:
  push:
    branches: [main]
    paths: ["src/**", "data/**", "build.py", "tools/validate.mjs", "index.html", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check data consistency
        run: node tools/validate.mjs
      - name: Build index.html from source
        run: python3 build.py
      - name: Publish rebuilt page if it changed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if git diff --quiet -- index.html; then echo "index.html already matches the source"; exit 0; fi
          git config user.name "occ-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html from source"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
