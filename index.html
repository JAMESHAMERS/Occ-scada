.av{width:30px;height:30px;border-radius:2px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:12px;background:var(--surface-3);color:var(--text);flex:none}
.user-n{display:flex;flex-direction:column;text-align:left;line-height:1.2}
.user-n b{font-size:12.5px;font-weight:600;white-space:nowrap}
.user-n span{font-size:11px;color:var(--muted);white-space:nowrap}
.menu{position:absolute;right:0;top:42px;width:290px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:4px;z-index:40}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;text-align:left;color:var(--text-2);font-size:13px}
.menu .mi:hover{background:var(--surface-2);color:var(--text)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu-h{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.hamb{display:none}
.stbar{flex:none;height:26px;display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--bg-2);font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden;padding-right:env(safe-area-inset-right,0px)}
.stbar>span{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--line);white-space:nowrap}
.stbar>span:first-child{color:var(--text-2);font-family:var(--f-cond);font-weight:600;letter-spacing:.06em}
.stbar .grow{flex:1;border-right:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stbar .clk{color:var(--text);border-left:1px solid var(--line);border-right:0}
.stbar i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

.view{flex:1;overflow:auto;padding:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:20px;scrollbar-width:thin}
.view-in{display:flex;flex-direction:column;gap:12px;max-width:1760px;margin:0 auto}

/* ---------- Panels & instrument strips ---------- */
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(7,minmax(0,1fr))}
.g-kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-kpi5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-kpi,.g-kpi4,.g-kpi5{gap:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.g-kpi>.kpi,.g-kpi4>.kpi,.g-kpi5>.kpi{border:0;border-radius:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:38px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-family:var(--f-cond);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text)}
.ph .sub{font-size:11.5px;color:var(--muted)}
.ph .act{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 0}
.pb{padding:12px;min-width:0;flex:1}
.pb.flush{padding:0}
.kpi{padding:11px 14px 12px;display:flex;flex-direction:column;gap:1px;min-width:0;background:var(--surface)}
.kpi-l{font-family:var(--f-cond);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-family:var(--f-num);font-size:28px;font-weight:500;line-height:1.12;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.kpi-v small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi-s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--surface-3);overflow:hidden;margin-top:7px;position:relative}
.bar i{display:block;height:100%;background:var(--fill);transition:width .6s}
.c-wind{color:var(--wind)!important} .bg-wind{background:var(--wind-soft)!important;color:var(--wind)!important}
.c-solar{color:var(--solar)!important} .bg-solar{background:var(--solar-soft)!important;color:var(--solar)!important}
.c-ok{color:var(--ok)!important} .bg-ok{background:var(--ok-soft)!important;color:var(--ok)!important}
.c-warn{color:var(--warn)!important} .bg-warn{background:var(--warn-soft)!important;color:var(--warn)!important}
.c-crit{color:var(--crit)!important} .bg-crit{background:var(--crit-soft)!important;color:var(--crit)!important}
.c-maint{color:var(--maint)!important} .bg-maint{background:var(--maint-soft)!important;color:var(--maint)!important}
.c-off{color:var(--off)!important} .bg-off{background:var(--off-soft)!important;color:var(--text-2)!important}
.c-curt{color:var(--curt)!important} .bg-curt{background:var(--curt-soft)!important;color:var(--curt)!important}
.c-acc{color:var(--accent)!important}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:2px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:2px;font-size:11px;font-weight:500;font-family:var(--f-mono);border:1px solid var(--line-2);color:var(--text-2)}
.sev{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px 0 0;border-radius:2px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);overflow:hidden}
.sev::before{content:attr(data-p);display:grid;place-items:center;width:20px;height:20px;font-family:var(--f-mono);font-size:11px;font-weight:600}
.sev.p1::before{background:var(--crit);color:#fff} .sev.p2::before{background:var(--warn);color:#1A1205} .sev.p3::before{background:var(--p3);color:#1A1605} .sev.p4::before{background:var(--p4);color:#06121F}
.health{display:inline-grid;place-items:center;min-width:34px;height:20px;border-radius:2px;font-family:var(--f-num);font-weight:600;font-size:13px}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-family:var(--f-cond);font-weight:500;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-size:11px;letter-spacing:.07em;text-transform:uppercase;position:sticky;top:0;background:var(--surface);z-index:1}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t .r{text-align:right} table.t .c{text-align:center}
table.t tr.click{cursor:pointer}
table.t td.num,table.t .r{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-width:100%}

.banner{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--curt);background:var(--surface);color:var(--text-2);font-size:12.5px;flex-wrap:wrap}
.banner b{color:var(--text);font-family:var(--f-cond);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.banner.warn{border-left-color:var(--warn)} .banner.off{border-left-color:var(--off)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:0;font-size:12px;color:var(--text-2);border:1px solid var(--line);background:var(--surface)}
.meta>span{padding:5px 10px;border-right:1px solid var(--line)}
.meta .sep{display:none}
.meta .tag{border:0;padding:0;height:auto;color:var(--text);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* overview */
.g-ov{grid-template-columns:minmax(0,.85fr) minmax(0,1.55fr) minmax(0,1.3fr)}
.g-ov2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.donut-w{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{font-family:var(--f-num);font-size:16px;font-weight:600;min-width:14px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line)}
.mini3 div{padding:10px 6px 0;border-right:1px solid var(--line)}
.mini3 div:last-child{border-right:0}
.mini3 b{display:block;font-family:var(--f-num);font-size:22px;font-weight:500;color:var(--text)!important}
.mini3 span{font-family:var(--f-cond);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.asset{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line)}
.asset-c{padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.asset-c+.asset-c{border-left:1px solid var(--line)}
.asset-c h4{margin:0 0 3px;display:flex;align-items:center;gap:8px;font-family:var(--f-cond);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.asset-c h4 .sw{width:10px;height:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-2);border-bottom:1px dotted var(--line);padding-bottom:5px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--f-num);font-size:14px;color:var(--text);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.ov-side{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);padding-left:14px;gap:12px}
.ov-side .kpi-v{font-size:22px}

/* map */
.map-w{position:relative;min-height:330px;flex:1;overflow:hidden;background:var(--sea)}
.map-w svg.map{display:block;width:100%;height:100%;position:absolute;inset:0;cursor:grab}
.map-w svg.map:active{cursor:grabbing}
.map-ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;z-index:2;border:1px solid var(--line-2);background:var(--surface)}
.map-ctl button{width:30px;height:30px;display:grid;place-items:center;border:0;border-bottom:1px solid var(--line-2);background:transparent;color:var(--text-2)}
.map-ctl button:last-child{border-bottom:0}
.map-ctl button:hover{color:var(--text);background:var(--surface-2)}
.map-leg{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;padding:5px 9px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);font-size:11px;color:var(--text-2);z-index:2}
.map-leg span{display:inline-flex;align-items:center;gap:5px}
.map-coord{position:absolute;right:8px;bottom:8px;padding:3px 8px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);font-family:var(--f-mono);font-size:10.5px;color:var(--text-2);z-index:2}
.map-tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:190px;transform:translate(12px,-50%)}
.map-tip b{display:block;font-size:12.5px;margin-bottom:3px}
.map-presets{position:absolute;left:8px;top:8px;z-index:2}
.gis{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;min-height:calc(100vh - 150px)}
.gis-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.plist{display:flex;flex-direction:column}
.plist button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:transparent;text-align:left;color:var(--text)}
.plist button:hover{background:var(--surface-2)} .plist button.on{background:var(--surface-2);border-left-color:var(--accent)}
.plist button:last-child{border-bottom:0}
.plist .pn{font-weight:500;font-size:13px}
.plist .pm{font-size:11.5px;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:0;font-size:12.5px;margin:0}
.dl dt{color:var(--muted);padding:5px 12px 5px 0;border-bottom:1px dotted var(--line)}
.dl dd{margin:0;text-align:right;font-weight:500;padding:5px 0;border-bottom:1px dotted var(--line)}

/* station */
.st-head{display:flex;flex-direction:column;gap:8px}
.g-st{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.twin-w{position:relative;height:430px;overflow:hidden;background:#0B0E12}
.twin-w canvas{display:block}
.twin-hud{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.twin-hud .chip{background:rgba(12,15,19,.82);color:#DDE3EA;border:1px solid rgba(255,255,255,.1);font-family:var(--f-mono);font-size:11px}
.twin-ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:2}
.twin-ctl .seg{background:rgba(12,15,19,.82);border-color:rgba(255,255,255,.14)}
.twin-ctl .seg button{color:#A9B3C0;border-color:rgba(255,255,255,.14)}
.twin-ctl .seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:#fff}
.twin-load{position:absolute;inset:0;display:grid;place-items:center;color:#9AA5B3;font-size:12.5px;font-family:var(--f-mono)}
.lbl3d{font-family:var(--f-mono);font-size:10.5px;color:#E6EBF1;background:rgba(12,15,19,.84);border:1px solid rgba(255,255,255,.14);border-radius:1px;padding:1px 6px;white-space:nowrap;display:flex;align-items:center;gap:5px;pointer-events:auto;cursor:pointer;transform:translateY(-6px)}
.lbl3d i{width:7px;height:7px;border-radius:50%}
.lbl3d b{font-weight:500;color:#fff}
.lbl3d.big{font-size:12px;padding:3px 8px}
.lbl3d.call{font-family:var(--f-ui);font-size:11px;padding:3px 8px 3px 7px;transform:translateY(-26px);border-left:2px solid rgba(255,255,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.lbl3d.call::after{content:"";position:absolute;left:12px;top:100%;width:1px;height:20px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}
.lbl3d.call span{color:#9FD3FF;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lbl3d.call.watch{border-left-color:#F5A524}.lbl3d.call.bad{border-left-color:#F4475E;background:rgba(60,12,20,.88)}
.lbl3d.call.on{background:rgba(20,52,96,.94);border-color:#4FA3FF}
.lbl3d.call:hover{background:rgba(26,34,46,.95)}
.twin-leg{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;align-items:center;z-index:2;background:rgba(12,15,19,.82);border:1px solid rgba(255,255,255,.1);padding:4px 9px;font-family:var(--f-mono);font-size:10.5px;color:#DDE3EA}
.twin-leg span{display:flex;align-items:center;gap:5px}.twin-leg i{width:14px;height:3px;display:inline-block}
.twin-ctl{flex-wrap:wrap;justify-content:flex-end}
.st-bar{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line)}
.st-bar .sb-it{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;font-size:12px;font-weight:500;border-right:1px solid var(--line);background:transparent!important}
.st-bar .sb-it:last-child{border-right:0}
.tgrid{display:flex;flex-direction:column;gap:12px}
.feeder h5{margin:0 0 6px;font-family:var(--f-cond);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.tiles.inv{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.tile{position:relative;border:1px solid var(--line);border-left:3px solid var(--line-2);background:var(--bg-2);padding:7px 9px;text-align:left;color:var(--text);min-width:0;border-radius:var(--r-sm)}
.tile:hover{border-color:var(--faint)}
.tile .tn{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--text-2)}
.tile .tv{font-family:var(--f-num);font-size:19px;font-weight:500;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .tv small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.tile .ts{font-size:11px;color:var(--muted)}
.tile .bar{height:3px;margin-top:5px}
.tile .tn .c-ok{color:var(--faint)!important}
.tile.s-fault{border-left-color:var(--crit);background:var(--crit-soft)}
.tile.s-fault .tv{color:var(--crit)}
.tile.s-comm{border-left-color:var(--off);border-style:dashed;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--off-soft) 6px 8px)}
.tile.s-comm .tv{color:var(--muted)}
.tile.s-maint{border-left-color:var(--maint)}
.tile.s-limit{border-left-color:var(--curt)}
.tile.s-stop{border-left-color:var(--warn)}
.tile.inv .tv{font-size:15px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.55);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line-2);z-index:51;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:.5}to{transform:none;opacity:1}}
.dr-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.dr-h h3{margin:0;font-family:var(--f-mono);font-size:16px;font-weight:500}
.dr-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.dr-b>*{flex:none}
.dr-3d{position:relative;height:300px;overflow:hidden;background:#0B0E12;border:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line)}
.m{padding:8px 10px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.m span{display:flex;align-items:center;gap:5px;font-family:var(--f-cond);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m b{font-family:var(--f-num);font-size:19px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.m b small{font-size:11px;color:var(--muted);margin-left:2px;font-weight:400}

/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;padding:16px}
.modal-c{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-top:3px solid var(--brand);box-shadow:var(--shadow);position:relative}
.modal-c.wide{width:min(880px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-family:var(--f-cond);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.mb{padding:16px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}

/* toasts */
.toasts{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(36px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:80;max-width:min(380px,calc(100vw - 28px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--accent);box-shadow:var(--shadow);font-size:12.5px;animation:tin .2s ease-out}
.toast.k-ok{border-left-color:var(--ok)} .toast.k-warn{border-left-color:var(--warn)} .toast.k-crit{border-left-color:var(--crit)}
.toast b{display:block;font-size:12.5px}
@keyframes tin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line)}
.fbar label{font-family:var(--f-cond);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sel{height:28px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg-2);padding:0 26px 0 9px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 11px,calc(100% - 8px) 11px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%;font-size:12.5px}
.txt{height:28px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg-2);padding:0 9px;outline:0;min-width:0}
.txt:focus,.sel:focus{border-color:var(--accent)}
.chart{width:100%;height:300px}
.chart.tall{height:380px}
.chart.sm{height:220px}
.empty{display:grid;place-items:center;text-align:center;padding:36px 20px;color:var(--muted);gap:8px}
.empty .i{width:30px;height:30px;color:var(--faint)}
.matrix td.c svg{color:var(--ok)}
.matrix td.c .no{color:var(--faint)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.srv{display:flex;flex-direction:column;gap:7px}
.srv-c{padding:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.srv-c h4{margin:0;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.meter{display:grid;grid-template-columns:52px 1fr 44px;gap:8px;align-items:center;font-size:12px}
.meter .bar{margin:0;height:6px}
.paper{background:#fff;color:#14223A;padding:28px 30px;font-size:12px;box-shadow:0 4px 20px rgba(0,0,0,.25);max-width:100%;overflow:auto;font-family:Arial,"Noto Sans SC",sans-serif}
.paper h2{margin:0;font-size:17px;color:#0044B8}
.paper table{width:100%;border-collapse:collapse;margin-top:10px}
.paper th,.paper td{border:1px solid #C8D3E3;padding:5px 7px;text-align:right;white-space:nowrap}
.paper th{background:#E8EEF8;color:#14223A}
.paper td:first-child,.paper th:first-child{text-align:left}
.rep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.rep{display:flex;flex-direction:column;gap:5px;padding:14px;border:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);background:transparent;text-align:left;color:var(--text)}
.rep:hover{background:var(--surface-2)}
.rep b{font-size:13.5px}
.rep span{font-size:12px;color:var(--muted)}
.rep .mono{color:var(--faint);font-size:11px}
.locked{display:grid;place-items:center;min-height:50vh;text-align:center;gap:10px;color:var(--muted)}
.locked .i{width:36px;height:36px;color:var(--warn)}
.comp-list{display:flex;flex-direction:column;border:1px solid var(--line)}
.comp{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:transparent;font-size:12.5px;cursor:pointer;text-align:left;color:var(--text);width:100%}
.comp:last-child{border-bottom:0}
.comp:hover{background:var(--surface-2)} .comp.on{background:var(--surface-2);border-left-color:var(--accent)}
.g-twin{grid-template-columns:250px minmax(0,1fr) 320px}
.twin-big{height:calc(100vh - 176px);min-height:460px;position:relative;overflow:hidden;background:#0B0E12;border:1px solid var(--line)}
.eq-list{max-height:calc(100vh - 270px);overflow:auto}
.eq-list button{display:flex;align-items:center;gap:8px;width:100%;border:0;border-left:3px solid transparent;background:transparent;padding:6px 12px;text-align:left;color:var(--text-2);font-size:12.5px;font-family:var(--f-mono)}
.eq-list button:hover{background:var(--surface-2);color:var(--text)} .eq-list button.on{background:var(--surface-2);color:var(--text);border-left-color:var(--accent)}
.eq-list .grp{font-family:var(--f-cond);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:10px 12px 4px}
.timeout{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:70}
.about{display:flex;flex-direction:column;gap:14px}
.about .hino{width:180px}
.pts-total td{font-weight:600;background:var(--surface-2)!important}

@media (max-width:1400px){ .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))} .g-ov{grid-template-columns:1fr 1fr} .g-ov>.ov-map{grid-column:1/-1;order:-1} .g-twin{grid-template-columns:230px minmax(0,1fr)} .g-twin>.twin-info{grid-column:1/-1} .search{display:none} }
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:45;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .sb.open{transform:none}
  .hamb{display:grid}
  .g-st,.g-ov2,.gis{grid-template-columns:minmax(0,1fr)}
  .g-kpi4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-kpi5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-hero{display:none}
  .g-twin{grid-template-columns:minmax(0,1fr)}
  .gis .map-w{min-height:62vh}
  .stbar .hide-md{display:none}
}
@media (max-width:720px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-ov,.asset,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .asset-c+.asset-c{border-left:0;border-top:1px solid var(--line)}
  .g-kpi5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .user-n,.top .hide-sm,.top-t p{display:none}
  .alsum button{min-width:34px}
  .kpi-v{font-size:24px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .twin-w{height:320px}
  .demo-list{grid-template-columns:1fr}
  .demo-acc:nth-child(odd){border-right:0}
  .demo-acc:nth-last-child(2){border-bottom:1px solid var(--line)}
  .stbar>span:not(:first-child):not(.clk){display:none}
  .stbar .grow{display:flex!important}
  .ov-side{border-left:0;padding-left:0}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

// ===================== Deterministic noise =====================
function hsh(i){ let h=Math.imul((i|0)^0x9e3779b9,0x85ebca6b); h^=h>>>13; h=Math.imul(h,0xc2b2ae35); h^=h>>>16; return (h>>>0)/4294967295*2-1; }
function vn(x,seed){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); const a=hsh(i*7919+seed*104729), b=hsh((i+1)*7919+seed*104729); return a+(b-a)*u; }
function fbm(x,seed){ return vn(x,seed)*0.6+vn(x*2.31,seed+7)*0.28+vn(x*5.13,seed+13)*0.12; }
function rnd(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const HOUR=3600e3, DAY=86400e3, TZ=7*HOUR;
const localH = ms => (((ms+TZ)/HOUR)%24+24)%24;
const dayStart = ms => Math.floor((ms+TZ)/DAY)*DAY-TZ;

// ===================== Physics models =====================
function windAt(s, ms, k=0){
  const m=ms/60000, h=localH(ms);
  let v=s.base + 1.1*Math.cos(2*Math.PI*(h-4)/24) + 2.0*fbm(m/95,s.seed) + 0.7*fbm(m/14,s.seed+3);
  if(k) v = v*(1+0.07*hsh(k*31+s.seed)) + 0.45*fbm(m/5,s.seed+k*17);
  return clamp(v,0.3,24);
}
function pcurve(v, rated){ if(v<3||v>=22) return 0; if(v>=11.2) return rated; const x=(v*v*v-27)/(11.2**3-27); return rated*clamp(x*(1.16-0.16*x),0,1); }
function solarPos(ll, ms){
  const [lon,lat]=ll, d=new Date(ms); const doy=Math.floor((ms-Date.UTC(d.getUTCFullYear(),0,0))/DAY);
  const B=2*Math.PI*(doy-81)/364, eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  const utcH=(ms/HOUR)%24, lst=utcH+lon/15+eot/60, H=(15*(lst-12))*Math.PI/180;
  const dec=23.44*Math.sin(2*Math.PI*(284+doy)/365)*Math.PI/180, phi=lat*Math.PI/180;
  const el=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  let az=Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))*180/Math.PI+180;
  return {el:el*180/Math.PI, az};
}
function irrAt(s, ms){ const {el}=solarPos(s.ll,ms); if(el<=0) return 0; const m=ms/60000; const cloud=clamp(0.80+0.30*fbm(m/38,s.seed)+0.08*fbm(m/6,s.seed+5),0.28,1.02); return 1060*Math.pow(Math.sin(el*Math.PI/180),1.18)*cloud*1.04; }
function ambAt(s, ms){ const h=localH(ms); const base = s.id==="LXS"?25.5 : (s.id==="VHO"||s.id==="BTH")?27.5 : 22.5; return base+5.2*Math.sin(2*Math.PI*(h-9)/24)+0.8*fbm(ms/3.6e6,s.seed); }
function unitState(s,id){ if(s.states==="comm") return "comm"; return (s.states&&s.states[id])||"run"; }
function unitRated(s,id){ return s.type==="wind" ? (s.ratedOf? s.ratedOf(id): s.rated) : s.invKW/1000; }
// cap = installed capacity as stated in the proposal (MW for wind, MWac Vĩnh Hảo, MWp Lập Tốn); acCap = grid-side AC limit used for physics
const acCap = s => s.capAC ?? s.cap;
const capLabel = (s,d=1) => nf(s.cap, s.capUnit==="MWp"?3 : s.capUnit==="MWac"?2 : d)+(s.capUnit && s.capUnit!=="MW" ? " "+s.capUnit : "");

// Station power at time ms. Returns {p, th, units?}
function stationPower(s, ms, detail=false){
  const out = detail? [] : null; let p=0, th=0;
  if(s.type==="wind"){
    s.units.forEach((u,i)=>{ const r=unitRated(s,u.id), v=windAt(s,ms,i+1), pa=pcurve(v,r); th+=pa; const st=unitState(s,u.id);
      let pu = (st==="run"||st==="limit")? pa*(0.97+0.02*hsh(i)) : 0;
      if(detail) out.push({id:u.id,f:u.f,v,p:pu,pa,st,r}); p+=pu; });
    if(s.pset && p>s.pset){ const f=s.pset/p; p=s.pset; if(detail) out.forEach(o=>{ if(o.p>0) o.p*=f; }); }
    if(s.notOper){ p=0; th=0; if(detail) out.forEach(o=>{o.p=null;o.v=null;}); }
  } else {
    const g=irrAt(s,ms), amb=ambAt(s,ms), tm=amb+g*0.032, der=1-0.0038*Math.max(0,tm-25);
    const dc = g/1000*s.capDC*0.86*der, acc=acCap(s); th=Math.min(acc,dc);
    s.units.forEach((u,i)=>{ const r=unitRated(s,u.id), st=unitState(s,u.id); const share=th/s.n*(1+0.035*hsh(i*13+s.seed));
      let pu = st==="run"? Math.min(r,share) : st==="limit"? Math.min(r*0.72,share) : 0; if(detail) out.push({id:u.id,f:u.f,p:pu,pa:share,st,r,g}); p+=pu; });
  }
  return {p,th,units:out};
}

// ===================== Live state & history =====================
const LIVE = { t:Date.now(), st:{}, lastTick:Date.now() };
function initHistory(){
  const now=Date.now(), d0=dayStart(now), step=5*60e3;
  STATIONS.forEach(s=>{
    const hrs=Array.from({length:24},()=>({e:0,th:0,w:0,n:0}));
    let e=0, eth=0, pmax=0;
    for(let t=d0; t<=now; t+=step){ const r=stationPower(s,t); const h=Math.floor(localH(t)); const de=r.p*step/HOUR, dth=r.th*step/HOUR; e+=de; eth+=dth; hrs[h].e+=de; hrs[h].th+=dth; hrs[h].n++; hrs[h].w+= s.type==="wind"? windAt(s,t) : irrAt(s,t); pmax=Math.max(pmax,r.p); }
    hrs.forEach(x=>{ if(x.n) x.w/=x.n; });
    // yesterday 5-min curve & total
    const yc=[]; let ye=0; for(let t=d0-DAY; t<d0; t+=step){ const r=stationPower(s,t); ye+=r.p*step/HOUR; yc.push(r.p); }
    // month to date (hourly sampling for past days)
    const dm=new Date(now+TZ); const mStart=Date.UTC(dm.getUTCFullYear(),dm.getUTCMonth(),1)-TZ; let mtd=0;
    for(let t=mStart; t<d0; t+=HOUR) mtd+=stationPower(s,t).p;
    LIVE.st[s.id]={ e, eth, pmax, hrs, ye, yc, mtd, aux: s.type==="wind"? 0.78+0.22*Math.abs(hsh(s.seed)) : 0.22+0.4*Math.abs(hsh(s.seed)), comm: s.notOper? 0: 1 };
  });
  // 5-min curves for today (portfolio trend)
  LIVE.curve=[]; for(let t=d0; t<=now; t+=step){ let p=0,th=0; STATIONS.forEach(s=>{const r=stationPower(s,t); p+=r.p; th+=r.th;}); LIVE.curve.push([t,p,th]); }
  tick(true);
}
function tick(first){
  const now=Date.now(), dt=(now-LIVE.lastTick)/HOUR; LIVE.t=now;
  STATIONS.forEach(s=>{ const L0=LIVE.st[s.id]; const r=stationPower(s,now,true); L0.p=r.p; L0.th=r.th; L0.units=r.units;
    if(!first){ L0.e+=r.p*dt; L0.eth+=r.th*dt; const h=Math.floor(localH(now)); L0.hrs[h].e+=r.p*dt; L0.hrs[h].th+=r.th*dt; L0.pmax=Math.max(L0.pmax,r.p); }
    if(s.type==="wind"){ L0.v=s.notOper?null:windAt(s,now); L0.dir=(250+40*fbm(now/3.6e6,s.seed+9)+360)%360; }

async function doLogin(u, pw, rem){
  LOGIN.err=null; const lk=lockInfo(u); const now=Date.now();
  if(lk.until>now){ const m=Math.ceil((lk.until-now)/60000); LOGIN.err=t("locked",{t:`${m} ${S.lang==="en"?"min":S.lang==="zh"?"分钟":"phút"}`}); renderLogin(); return; }
  LOGIN.busy=true; renderLogin(); const h=await sha256(SALT+":"+pw); await new Promise(r=>setTimeout(r,450)); LOGIN.busy=false;
  const acc=USERS.find(x=>x.u===u);
  if(!acc || acc.h!==h){ lk.n=(lk.n||0)+1; if(lk.n>=5){ lk.until=now+5*60e3; lk.n=0; audit("a_lock",u,"fail",u||"unknown"); LOGIN.err=t("locked",{t:`5 ${S.lang==="en"?"min":S.lang==="zh"?"分钟":"phút"}`}); } else LOGIN.err=t("badCred",{n:5-lk.n}); setLock(u,lk); audit("a_login","", "fail", u||"unknown"); renderLogin(); return; }
  if(!acc.enabled){ LOGIN.err=t("disabledAcc"); audit("a_login","disabled","fail",u); renderLogin(); return; }
  setLock(u,{n:0,until:0}); store.set("rememberU", rem?u:"");
  if(acc.mfa){ LOGIN.step="otp"; LOGIN.pending=acc; renderLogin(); return; }
  finishLogin(acc);
}
function finishLogin(acc){
  S.user=acc; LOGIN.step="cred"; LOGIN.err=null; LOGIN.pending=null; S.lastAct=Date.now(); S.loginAt=Date.now(); audit("a_login","","ok",acc.u);

  const first = can("overview")? "overview" : "alarms"; go(first);
  store.set("session",{u:acc.u,t:Date.now()});
}

function distKm(a,b){ const R=6371, toR=Math.PI/180; const dLat=(b[1]-a[1])*toR, dLon=(b[0]-a[0])*toR; const x=Math.sin(dLat/2)**2+Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

function customParams(s){ return s.type==="wind" ? [
    {k:"p",l:"power",u:"kW",f:(v,r,amb)=>r.p}, {k:"v",l:"windSpd",u:"m/s",f:(v)=>v}, {k:"rpm",l:"rotor",u:"rpm",f:(v,r)=>r.p>0?clamp(4.2+0.7*v,0,11.8):0.3},
    {k:"pitch",l:"pitch",u:"°",f:(v,r)=>r.p>0?(v>11.2?(v-11.2)*2.4+1:0.4):88}, {k:"gen",l:"genT",u:"°C",f:(v,r,amb,rt)=>amb+(r.p>0?22+28*r.p/rt/1000:6)}, {k:"gb",l:"gbT",u:"°C",f:(v,r,amb,rt)=>amb+(r.p>0?26+16*r.p/rt/1000:5)}, {k:"amb",l:"ambT",u:"°C",f:(v,r,amb)=>amb} ]
  : [ {k:"p",l:"acP",u:"kW",f:(g,r)=>r.p}, {k:"g",l:"irr",u:"W/m²",f:(g)=>g}, {k:"tm",l:"modT",u:"°C",f:(g,r,amb)=>amb+g*0.032}, {k:"dcv",l:"dcV",u:"V",f:(g)=>g>20?(s.type==="solar"?910:620)-0.04*g:0},
      {k:"igbt",l:"igbt",u:"°C",f:(g,r,amb,rt)=>amb+(r.p>0?12+18*r.p/rt/1000:1)}, {k:"amb",l:"ambT",u:"°C",f:(g,r,amb)=>amb} ]; }
function customSeries(s, uid, days){
  const k=s.units.findIndex(u=>u.id===uid)+1, rt=unitRated(s,uid), st=unitState(s,uid), end=Math.floor(Date.now()/600e3)*600e3, start=end-days*DAY; const P=customParams(s); const rows=[];
  for(let t=start;t<=end;t+=600e3){ const amb=ambAt(s,t); let x, p;
    if(s.type==="wind"){ const i=t/600e3, vt=Math.max(0,windAt(s,t,k)*(1+0.42*fbm(t/60000/2600,s.seed+51))); // multi-day weather systems
      x=Math.max(0,vt+0.55*hsh(i*3+k)+0.25*hsh(i*7+k+1)); // nacelle anemometer reading: turbulence + wake
      p=(st==="comm"||s.notOper)?0:Math.max(0,pcurve(vt,rt)*1000*(1+0.03*hsh(i+k))); }

    const r={p}; rows.push([t, ...P.map(q=>+q.f(x,r,amb,rt).toFixed(2))]); }
  return {P, rows}; }

// Each model exposes:
//   refs.parts[comp]   – group per component (health colouring, focus, exploded view)
//   refs.cover[]       – enclosure meshes (cut away / lifted off)
//   refs.clip          – {frame, normal, point}: cut plane in the frame's local space
//   refs.anchors[comp] – callout position (local to the part group)

  const V3 = (x, y, z) => new T.Vector3(x, y, z);
  // one material per (component, look) so health colours never bleed between components
  function matFactory() {

      P(comp, parent = root, off = [0, 0, 0], anchor = [0, 1, 0]) { const g = new T.Group(); g.userData.part = comp; parent.add(g); parts[comp] = g; offsets[comp] = off; anchors[comp] = anchor; return g; },

    add(ac, cyl(0.03, 0.03, 0.06, 16), M("acOut", 0x1B1E22), [0.42, cy - H / 2 - 0.02, 0.1]);
    [[0xD62828, 0.36], [0x111418, 0.4], [0x2563EB, 0.44], [0x1F9D55, 0.48]].forEach(([c, x]) => tube(ac, [[x, cy - 0.23, -0.01], [x, cy - 0.3, 0.02], [0.42, cy - H / 2 + 0.01, 0.06]], 0.005, M("acOut", c, { metalness: 0.1 }), 10));
    // AC combiner box on the rack
    add(ac, box(0.45, 0.55, 0.2), M("acOut", 0xE9ECEF, { metalness: 0.2 }), [1.3, 1.0, -0.25]); add(ac, new T.PlaneGeometry(0.1, 0.1), new T.MeshBasicMaterial({ color: 0xF2C14E }), [1.3, 1.15, -0.149]);

    flowCable(pf, [[1.3, 1.27, -0.25], [1.6, 1.9, -0.3], [3.5, 2.0, -0.3], [8, 2.0, -0.3]], 0.014, "ac", flows);
    add(pf, box(7, 0.08, 0.25), M("tray", 0xB8C0C9, { metalness: 0.7 }), [5.0, 1.95, -0.3]).userData.noComp = true;

  function roofTex() { const c = document.createElement("canvas"); c.width = 64; c.height = 8; const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, 64, 0); g.addColorStop(0, "#9AA3AD"); g.addColorStop(0.12, "#E6EAEE"); g.addColorStop(0.22, "#B9C1CA"); g.addColorStop(0.6, "#C9D0D7"); g.addColorStop(1, "#9AA3AD");
    x.fillStyle = g; x.fillRect(0, 0, 64, 8); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.colorSpace = T.SRGBColorSpace; return t; }
  function meshTex() { const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"); x.strokeStyle = "rgba(160,170,180,1)"; x.lineWidth = 1.5;
    for (let i = -64; i < 128; i += 8) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 64, 64); x.stroke(); x.beginPath(); x.moveTo(i + 64, 0); x.lineTo(i, 64); x.stroke(); }
    const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(24, 4); return t; }

  return { windTurbine, solarCentral, solarString, moduleTex, pvTableMats };
};

// ===================== Boot =====================
let HERO=null;
function startHero(){ if(HERO||!$("#hero3d")||getComputedStyle($(".login-hero")).display==="none") return; HERO="pending"; THREE3D.hero($("#hero3d")).then(h=>{ if(S.user){ h&&h.dispose(); HERO=null; return; } HERO=h; }); }
function stopHero(){ if(HERO&&HERO!=="pending") HERO.dispose(); HERO=null; }
(function boot(){
  const th=store.get("theme"); applyTheme(th||"dark");
  const lg=store.get("lang"); S.lang = LANGS.includes(lg)? lg : "vi"; document.documentElement.lang = S.lang==="zh"?"zh-CN":S.lang; document.body.classList.toggle("zh",S.lang==="zh");
  initHistory(); seedAlarms(); applyStatic(); renderLogin(); startHero();
  setInterval(()=>{ tick(); if(!S.user) return; if(PAGE_UPD){ try{ PAGE_UPD(); }catch(e){ console.warn(e); } } }, 2000);
  setInterval(()=>{ if(!S.user||!can("alarm")) return; if(Math.random()<0.5){ const a=randomAlarm(); if(a){ toast(t("newAlarm",{s:`${a.st} · ${a.dev}`}), alarmText(a), a.sev<=2?"warn":"info"); renderShell(); } } // clear an old non-critical one
      const old=ALARMS.filter(a=>!a.cleared&&a.sev>=3&&a.acked&&Date.now()-a.t>40*60e3); if(old.length){ const a=old[0]; a.cleared=true; a.clrT=Date.now(); } }, 75000);
  window.addEventListener("resize",()=>{ if(!S.user && !HERO) startHero(); });
})();
